function getEmbedUrl(url) {
  if(!url) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return `https://www.youtube.com/embed/${yt[1]}?rel=0&autoplay=1`;
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return `https://player.vimeo.com/video/${vimeo[1]}?autoplay=1`;
  // Google Drive: /file/d/ID/view → /file/d/ID/preview
  const gd = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(gd) return `https://drive.google.com/file/d/${gd[1]}/preview`;
  return null;
}
function isDirectVideo(url) {
  if(!url) return false;
  if(url.includes('firebasestorage.googleapis.com')) return true;
  return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url);
}

function useRecords() {
  const [records, setRecords] = useState([]);
  useEffect(() => {
    const ref = db.ref('logs');
    ref.on('value', snap => {
      const val = snap.val();
      const arr = val ? Object.values(val) : [];
      arr.sort((a, b) => b.timestamp - a.timestamp);
      setRecords(arr);
    });
    return () => ref.off();
  }, []);
  const addRecord = useCallback(rec => {
    db.ref('logs').push(rec);
  }, []);
  return { records, addRecord };
}

function useIssues() {
  const [issues, setIssues] = useState(DEFAULT_ISSUES);
  const [issuesLoaded, setIssuesLoaded] = useState(false);
  const seeded = useRef(false);
  useEffect(() => {
    const ref = db.ref('issues');
    const handler = snap => {
      const val = snap.val();
      if (!val) {
        // Firebase empty — seed with defaults (only once)
        if (!seeded.current) {
          seeded.current = true;
          const seed = {};
          DEFAULT_ISSUES.forEach((iss, i) => { seed[i] = iss; });
          ref.set(seed); // triggers handler again with the seeded data
        }
      } else {
        // Normalise Firebase object → array, filtering out any nulls
        const arr = (Array.isArray(val) ? val : Object.values(val)).filter(Boolean);
        setIssues(arr);
        setIssuesLoaded(true);
      }
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, []);
  const saveIssues = useCallback(list => {
    setIssues(list);
    const obj = {};
    list.forEach((iss, i) => { obj[i] = iss; });
    db.ref('issues').set(obj);
  }, []);
  return { issues, saveIssues, issuesLoaded };
}

function useGuides() {
  const [guides, setGuides] = useState({});
  useEffect(() => {
    const ref = db.ref('guides');
    ref.on('value', snap => {
      setGuides(snap.val() || {});
    });
    return () => ref.off();
  }, []);
  const saveGuide = useCallback((id, url) => {
    db.ref('guides').child(id).set(url);
  }, []);
  const removeGuide = useCallback(id => {
    db.ref('guides').child(id).remove();
  }, []);
  return { guides, saveGuide, removeGuide };
}

function useTimer(active) {
  const [elapsed, setElapsed] = useState(0);
  const origin = useRef(null); const tick = useRef(null);
  useEffect(() => {
    if(active){ origin.current=Date.now(); setElapsed(0); tick.current=setInterval(()=>setElapsed(Math.floor((Date.now()-origin.current)/1000)),500); }
    else clearInterval(tick.current);
    return () => clearInterval(tick.current);
  },[active]);
  return elapsed;
}

function useEscClose(handler, enabled=true) {
  useEffect(() => {
    if(!enabled) return;
    const fn = e => { if(e.key==="Escape") handler(); };
    window.addEventListener("keydown",fn); return () => window.removeEventListener("keydown",fn);
  },[handler,enabled]);
}

// Determine how to play a URL
function classifyUrl(url) {
  if(!url) return "none";
  if(isDirectVideo(url)) return "video";
  const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return "embed";
  if(url.match(/vimeo\.com\/(\d+)/)) return "embed";
  if(url.match(/drive\.google\.com\/file\/d\//)) return "embed"; // Google Drive /preview
  return "external"; // SharePoint, OneDrive, other — blocked by X-Frame-Options
}

        <span style={{fontSize:13,fontWeight:700,color:"#fff",display:"inline-flex",alignItems:"center",gap:6}}><IC n="video" s={13} c="#fff"/> {title||"Video Guide"}</span>
      </div>
      <button onClick={onClose} style={{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,.12)",border:"none",color:"#fff",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
    </div>
  );

  return (
    <>
      <div className="video-sheet-bg" onClick={onClose}
        style={{position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:400,touchAction:"none"}}/>
      <div className="video-sheet"
        style={{position:"fixed",bottom:0,left:0,right:0,zIndex:401,background:"#111",
          borderRadius:"18px 18px 0 0",overflow:"hidden",maxHeight:"85vh",display:"flex",flexDirection:"column"}}>
        <SheetHeader/>

        {/* ── Inline player: direct video or embeddable URL ── */}
        {(kind==="video"||kind==="embed")&&(
          <div style={{flex:1,overflow:"hidden",background:"#000"}}>
            {kind==="video"?(
              <video src={url} controls autoPlay playsInline
                style={{width:"100%",height:"100%",maxHeight:"72vh",display:"block",background:"#000"}}/>
            ):(
              <iframe src={embedUrl} style={{width:"100%",height:"100%",minHeight:"56vw",maxHeight:"72vh",border:"none",display:"block"}}
                allowFullScreen allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture"/>
            )}
          </div>
        )}

        {/* ── External URL: can't embed — open in new tab fallback ── */}
        {kind==="external"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            padding:"24px 20px",background:"#1a1a1a",gap:16,textAlign:"center"}}>
            <IC n="video" s={48} c="rgba(255,255,255,.6)"/>
            <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>Video can't play inside the app</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.5)",lineHeight:1.6,maxWidth:280}}>
              This link type (SharePoint / OneDrive / other) blocks in-app playback.{"\n"}
              Tap below to open it, watch, then come back and tap <strong style={{color:"#3aab5e"}}>Done</strong>.
            </div>
            <a href={url} target="_blank" rel="noopener noreferrer"
              style={{display:"inline-flex",alignItems:"center",gap:8,background:"#3aab5e",
                color:"#fff",borderRadius:10,padding:"12px 24px",fontWeight:700,fontSize:14,textDecoration:"none"}}>
              <IC n="play" s={14}/> Open Video
            </a>
            {opened&&<div style={{fontSize:11,color:"rgba(255,255,255,.4)"}}>Done? Tap the green button below ↓</div>}
          </div>
        )}

        {/* Continue button */}
        <div style={{padding:"12px 16px",background:"#1a1a1a",flexShrink:0}}>
          <button className="btn btn--green btn--full" style={{fontSize:14}} onClick={onClose}>
            <IC n="check" s={14}/> Done watching — continue steps
          </button>
        </div>
      </div>
    </>
  );
}

// ─── VIDEO GUIDE SECTION ──────────────────────────────────────────────────────
function VideoGuideSection({issueId, guideUrl, onSave, onRemove, adminUnlocked}) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(guideUrl||"");
  const [sheetOpen, setSheetOpen] = useState(false);

  const handleSave = () => {
    if(!draft.trim()) return;
    onSave(issueId, draft.trim()); setEditing(false);
  };

  return (
    <div>
      {/* Sheet */}
      {sheetOpen&&<VideoSheet url={guideUrl} onClose={()=>setSheetOpen(false)}/>}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:10,fontWeight:800,color:"var(--t3)",letterSpacing:".07em",display:"flex",alignItems:"center",gap:5}}><IC n="video" s={11} c="var(--t3)"/> VIDEO GUIDE</div>
        {guideUrl&&!editing&&adminUnlocked&&(
          <div style={{display:"flex",gap:6}}>
            <button className="btn" style={{padding:"3px 9px",fontSize:11,background:"#eaf6ee",border:"1px solid #a8d9b8",color:"var(--fgf-green)"}}
              onClick={()=>{setDraft(guideUrl);setEditing(true);}}>✏ Change</button>
            <button className="btn" style={{padding:"3px 9px",fontSize:11,background:"#fef2f2",border:"1px solid #fecaca",color:"var(--red)"}}
              onClick={()=>{onRemove(issueId);setDraft("");setEditing(false);}}>× Remove</button>
          </div>
        )}
        {guideUrl&&!editing&&!adminUnlocked&&(
          <span style={{fontSize:10,color:"var(--t4)",display:"flex",alignItems:"center",gap:3}}><IC n="lock" s={10} c="var(--t4)"/> Admin only</span>
        )}
      </div>

      {guideUrl&&!editing&&(
        <button onClick={()=>setSheetOpen(true)}
          style={{width:"100%",background:"linear-gradient(135deg,#1a1a1a,#2d2d2d)",border:"1px solid #444",borderRadius:10,
            padding:"14px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer",textAlign:"left"}}>
          <div style={{width:42,height:42,borderRadius:10,background:"var(--fgf-green)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <IC n="play" s={20} c="#fff"/>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:2}}>Watch Video Guide</div>
            <div style={{fontSize:10,color:"rgba(255,255,255,.45)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{guideUrl}</div>
          </div>
          <span style={{fontSize:10,color:"rgba(255,255,255,.35)",flexShrink:0}}>Tap to play</span>
        </button>
      )}

      {editing&&adminUnlocked&&(
        <div>
          <div style={{fontSize:11,color:"var(--t3)",marginBottom:6}}>Paste a YouTube, Google Drive, SharePoint, or .mp4 URL</div>
          <div style={{display:"flex",gap:6}}>
            <input value={draft} onChange={e=>setDraft(e.target.value)} placeholder="https://youtube.com/watch?v=…"
              className="input" style={{flex:1}} onKeyDown={e=>{if(e.key==="Enter")handleSave();}}/>
            <button className="btn btn--fgf" onClick={handleSave} disabled={!draft.trim()}>Save</button>
            {guideUrl&&<button className="btn btn--ghost" onClick={()=>{setDraft(guideUrl);setEditing(false);}}>Cancel</button>}
          </div>
        </div>
      )}
      {!guideUrl&&!editing&&adminUnlocked&&(
        <button className="btn btn--ghost" onClick={()=>setEditing(true)}
          style={{fontSize:12,width:"100%",justifyContent:"center",borderStyle:"dashed",borderColor:"var(--border-mid)"}}>
          + Add Video Guide
        </button>
      )}
    </div>
  );
}
