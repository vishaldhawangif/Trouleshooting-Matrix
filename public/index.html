                {[
                  {v:"All",      cls:"active-def",  dot:null,       text:"All"},
                  {v:"critical", cls:"active-crit", dot:"#ef4444",  text:"Critical"},
                  {v:"warning",  cls:"active-warn", dot:"#f59e0b",  text:"Warning"},
                  {v:"advisory", cls:"active-adv",  dot:"#3b82f6",  text:"Advisory"},
                ].map(({v,dot,text,cls})=>(
                  <button key={v} className={`pill-btn${filterSev===v?" "+cls:""}`}
                    style={{flexShrink:0,display:"inline-flex",alignItems:"center",gap:5}}
                    onClick={()=>setFilterSev(v)}>
                    {dot&&<span style={{width:7,height:7,borderRadius:"50%",background:dot,display:"inline-block",flexShrink:0}}/>}
                    {text}
                  </button>
                ))}
                <div style={{width:1,height:18,background:"var(--border-mid)",margin:"0 2px",flexShrink:0}}/>
                <span style={{fontSize:10,fontWeight:700,color:"var(--t4)",letterSpacing:".06em",flexShrink:0}}>CAT</span>
                {[
                  {v:"All",       icon:null,                         text:"All"},
                  {v:"equipment", icon:<IC n="settings" s={11}/>,    text:"Equipment"},
                  {v:"quality",   icon:<IC n="package" s={11}/>,     text:"Quality"},
                  {v:"safety",    icon:<IC n="shield-alert" s={11}/>, text:"Safety"},
                ].map(({v,icon,text})=>(
                  <button key={v} className={`pill-btn${filterCat===v?" active-grn":""}`}
                    style={{flexShrink:0,display:"inline-flex",alignItems:"center",gap:5}}
                    onClick={()=>setFilterCat(v)}>{icon}{text}</button>
                ))}
              </div>
            </div>
            {!issuesLoaded?(
              <div style={{textAlign:"center",padding:"80px 20px"}}>
                <div style={{width:40,height:40,borderRadius:"50%",border:"3px solid var(--border)",borderTopColor:"var(--acc)",margin:"0 auto 16px",animation:"spin 0.8s linear infinite"}}/>
                <div style={{fontSize:13,color:"var(--t4)",fontWeight:500}}>Loading issues…</div>
              </div>
            ):filtered.length===0?(
              <div style={{textAlign:"center",padding:"80px 20px"}}>
                <div style={{width:60,height:60,borderRadius:16,background:"var(--bg-deep)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}><IC n="search-x" s={28} c="var(--t4)"/></div>
                <div style={{fontSize:16,fontWeight:700,color:"var(--t2)",marginBottom:6}}>No issues match</div>
                <div style={{fontSize:13,color:"var(--t4)"}}>Try adjusting your filters or search term</div>
              </div>
            ):(
              <div className="card-grid">
                {filtered.map(issue=>(
                  <IssueCard key={issue.id} issue={issue}
                    logCount={logCounts[issue.id]||0}
                    hasGuide={!!guides[issue.id]}
                    onClick={()=>openIssue(issue)}/>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── ANALYTICS TAB ── */}
        {tab==="analytics"&&<AnalyticsTab records={records} issues={issues}/>}

        {/* ── ADMIN TAB ── */}
        {tab==="admin"&&(
          adminUnlocked
            ? <AdminPanel issues={issues} saveIssues={saveIssues}
                escalationEmail={escalationEmail} saveEscalation={saveEscalation}
                currentPin={adminPin} savePin={savePinFn} onResetData={resetData}
                guides={guides} saveGuide={saveGuide} removeGuide={removeGuide}/>
            : <PinGate correctPin={adminPin} onUnlock={()=>setAdminUnlocked(true)}/>
        )}
          </main>
        </div>{/* end main-wrap */}
      </div>{/* end app-layout */}

      {/* ═══════════════════ MOBILE BOTTOM NAV ═══════════════════ */}
      <nav className="mobile-nav">
        {NAV_ITEMS.map(({id,label,icon})=>(
          <button key={id} className="mobile-nav-btn" onClick={()=>setTab(id)}>
            <span className="mnav-icon" style={{color:tab===id?"#3aab5e":"rgba(255,255,255,.45)"}}>{icon}</span>
            <span className="mnav-label" style={{color:tab===id?"#3aab5e":"rgba(255,255,255,.60)"}}>{label}</span>
          </button>
        ))}
      </nav>

      {/* ── DETAIL PANEL ── */}
      {selectedIssue&&(
        <DetailPanel
          issue={selectedIssue} elapsed={elapsed}
          steps={checkedSteps} isClosed={isClosed} closedInfo={closedInfo}
          guideUrl={guides[selectedIssue.id]||""}
          onToggleStep={toggleStep} onSubmit={handleSubmit} onClose={closePanel}
          onSaveGuide={saveGuide} onRemoveGuide={removeGuide}
          escalationEmail={escalationEmail} adminUnlocked={adminUnlocked}/>
      )}

      {/* ── TOAST ── */}
      {toast&&<Toast toast={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
  </script>
